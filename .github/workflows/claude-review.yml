name: Claude review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: ติดตั้ง Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: ให้ Claude รีวิว diff ของ PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          claude -p "รีวิว diff นี้ตาม docs/review-checklist.md ตอบเป็นรายการ พร้อมระบุไฟล์:บรรทัด และระดับความรุนแรง ห้ามตอบ LGTM เปล่า ๆ: $(cat /tmp/pr.diff)" \
            --output-format json \
            --max-budget-usd 0.50 > /tmp/review.json
          jq -r '.result' /tmp/review.json > /tmp/review.md
          jq -r '"ค่าใช้จ่ายรอบนี้: $" + (.total_cost_usd|tostring)' /tmp/review.json >> /tmp/review.md

      - name: คอมเมนต์ผลรีวิวลง PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.number }} --body-file /tmp/review.md
